name: Keystore Pretest
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Validate android signing keystore (same steps as release)
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" || \
                -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || \
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'secrets missing!' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/nai-launcher-release.keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" 2>&1 | tail -3
          expected_signer_sha256="$({
            keytool -exportcert \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keypass "$ANDROID_KEY_PASSWORD"
          } | openssl dgst -sha256 -r | awk '{print tolower($1)}')"
          if [[ ! "$expected_signer_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Unable to derive signer digest.' >&2
            exit 1
          fi
          echo "SIGNER_SHA256=$expected_signer_sha256"
          echo "KEYSTORE_PRETEST: PASSED"
